# ntfy server for Lob. Copy server.yml next to this file and edit base-url.
# Create users and permissions with: docker exec -it ntfy ntfy user add <name>
services:
  ntfy:
    image: binwiederhier/ntfy:latest   # pin a version (e.g. v2.38.1) once it is running
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ${APPDATA_ROOT:-./data}/ntfy:/var/lib/ntfy   # cache.db, user.db, attachments/
    ports:
      - "${NTFY_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
