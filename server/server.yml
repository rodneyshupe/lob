# ntfy server settings for Lob. See docs/DESIGN.md section 3.1.
base-url: "https://lob.example.com"       # change: required for attachments
behind-proxy: true                         # behind Traefik / cloudflared

# 24-hour queue
cache-file: /var/lib/ntfy/cache.db
cache-duration: 24h

# Attachments (files are end-to-end encrypted by the client)
attachment-cache-dir: /var/lib/ntfy/attachments
attachment-file-size-limit: 100M
attachment-total-size-limit: 5G
attachment-expiry-duration: 24h            # must be <= cache-duration

# Per-user limits (defaults are too low for 100 MB files)
visitor-attachment-total-size-limit: 2G
visitor-attachment-daily-bandwidth-limit: 5G

# Users and access control
auth-file: /var/lib/ntfy/user.db
auth-default-access: deny-all
enable-signup: false
enable-login: true
